<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alex Card
    </title>
</head>
<style>
    .imageContainer img {
        height: 90px;
        width: 90px;
        border-radius: 50%;
       
    }
    .container {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .boxModel {
       background-color: white;
       border: black groove;
       border-radius: 1rem;
       /* margin: auto; */
       margin-top: 10rem;
       width: 20rem;
       height: 28rem;
       display: flex;
       align-items: center;
       justify-content: center;
       flex-direction: column;
    }

    .heading {
        text-align: center;
        text-wrap: wrap;
    }
    .heading h3 {
        color: rgba(0, 0, 0, 0.5);
        margin-bottom: 0;
    }
    .paragraph {
        text-align: center;
        padding: 0;
        margin-top: 0;
        margin: 2rem;
        color: rgba(0, 0, 0, 0.7);;
    }
    .buttonDiv button {
       width: 120px;
       height: 50px;
       border-radius: 0.5rem;
       border: none;
       background-color: blueviolet;
    }
    
    .buttonDiv button p {
        color: white;
     }
</style>
<body>
    <div class="container">
        <div class="boxModel">
            <div class="imageContainer">
                <img src="image.png" alt="">
            </div>
            <div class="heading">
                <h1>Alex Jhonson</h1>
                <h3>Frontend Developer</h3>
            </div>
            <div class="paragraph">
                Passionate about building beautiful web experiences. Love HTML, CSS, Javascript and creating real world projects.
            </div>
            <div class="buttonDiv">
                <button><p>View Profile</p></button>
            </div>
        </div>
    </div>
    
</body>
</html>
